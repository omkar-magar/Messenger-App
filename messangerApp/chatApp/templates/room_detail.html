<!DOCTYPE html>
<html>

<head>
    <title>{{ room.name }} - Chat</title>
    <style>
        .chat-box {
            border: 1px solid #ccc;
            height: 300px;
            overflow-y: scroll;
            padding: 10px;
            margin-bottom: 10px;
        }

        .message {
            margin-bottom: 5px;
        }

        .sender {
            font-weight: bold;
        }
    </style>
</head>

<body>
    <h1>Room: {{ room.name }}</h1>
    <a href="{% url 'chatApp:room_list' %}">&larr; Back to Rooms</a>

    <div class="chat-box" id="chat-box">
        {% for message in messages %}
        <div class="message">
            <span class="sender">{{ message.sender.username }}:</span> {{ message.content }}
        </div>
        {% empty %}
        <p id="empty-msg">No messages yet. Be the first to say hi!</p>
        {% endfor %}
    </div>

    <form method="POST" id="message-form">
        {% csrf_token %}
        <input type="text" name="content" id="chat-message-input" placeholder="Type a message..." autocomplete="off"
            autofocus>
        <button type="submit" id="chat-message-submit">Send</button>
    </form>

    <script>
        const roomName = "{{ room.name|escapejs }}";
        const wsProtocol = window.location.protocol === "https:" ? "wss://" : "ws://";
        const chatSocket = new WebSocket(wsProtocol + window.location.host + '/ws/chat/' + encodeURIComponent(roomName) + '/');
        const messageForm = document.querySelector('#message-form');
        const messageInputDom = document.querySelector('#chat-message-input');

        chatSocket.onopen = function () {
            console.log("WebSocket connected successfully!");
        };

        chatSocket.onclose = function () {
            console.error("WebSocket closed unexpectedly. Check your terminal for backend errors.");
        };

        chatSocket.onmessage = function (e) {
            const data = JSON.parse(e.data);
            const emptyMsg = document.getElementById('empty-msg');
            if (emptyMsg) { emptyMsg.style.display = 'none'; }

            const chatBox = document.getElementById('chat-box');
            let messageHtml = '<div class="message">';

            if (data.type === 'message') {
                messageHtml += '<span class="sender">' + data.username + ':</span> ' + data.message;
            } else if (data.type === 'join' || data.type === 'leave') {
                messageHtml += data.username + ' ' + data.content;
            } else if (data.type === 'error') {
                messageHtml += '<span class="sender">Error:</span> ' + data.message;
            } else {
                messageHtml += JSON.stringify(data);
            }

            messageHtml += '</div>';
            chatBox.innerHTML += messageHtml;
            chatBox.scrollTop = chatBox.scrollHeight;
        };

        messageForm.onsubmit = function (e) {
            const message = messageInputDom.value.trim();
            if (!message) {
                return false;
            }

            if (chatSocket.readyState === WebSocket.OPEN) {
                e.preventDefault();
                chatSocket.send(JSON.stringify({ 'message': message }));
                messageInputDom.value = '';
                return false;
            }

            return true;
        };
    </script>
</body>

</html>
