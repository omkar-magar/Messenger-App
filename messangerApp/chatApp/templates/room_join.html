<!DOCTYPE html>
<html>

<head>
    <title>Join {{ room.name }}</title>
</head>

<body>
    <h1>Join Private Room: {{ room.name }}</h1>

    {% if error %}
    <p style="color: red; font-weight: bold;">{{ error }}</p>
    {% endif %}

    <form method="POST">
        {% csrf_token %}
        <input type="password" name="join_password" placeholder="Enter Room Password" required autofocus>
        <button type="submit">Join</button>
    </form>
</body>

</html>
