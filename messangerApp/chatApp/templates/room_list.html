<!DOCTYPE html>
<html>

<head>
    <title>Chat Rooms</title>
</head>

<body>
    <h1>Available Chat Rooms</h1>
    <a href="{% url 'chatApp:room_create' %}">Create a New Room</a>
    <br><br>
    <ul>
        {% for room in rooms %}
        <li><a href="{% url 'chatApp:room_detail' room.name %}">{{ room.name }}</a> {% if room.is_private %}🔒{% endif %}</li>
        {% empty %}
        <li>No rooms available yet.</li>
        {% endfor %}
    </ul>
</body>

</html>
